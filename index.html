<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM Decision Tool</title>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5dc;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #1a1a1a;
            text-align: center;
            max-width: 700px;
            padding: 20px;
            z-index: 10;
            font-size: 32px;
            line-height: 1.25;
        }

        #cat-area {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 5;
        }

        #cat-message {
            display: none;
            max-width: 220px;
            background: white;
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.25;
            padding: 14px 18px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        #cat-container {
            width: 240px;
            height: 240px;
        }

        #cat-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background-color: white;
            transition: opacity 0.3s ease;
        }

        .btn-group {
            display: flex;
            gap: 30px;
            margin-top: 50px;
            z-index: 20;
        }

        button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            transition: transform 0.2s ease;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
        }

        .success-text {
            display: none;
            font-size: 28px;
            color: #2e7d32;
            text-align: center;
            font-weight: bold;
            padding: 20px;
            max-width: 700px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 24px;
                padding: 16px;
            }

            #cat-area {
                top: 10px;
                right: 10px;
                gap: 8px;
            }

            #cat-message {
                max-width: 140px;
                font-size: 13px;
                padding: 10px 12px;
                border-radius: 14px;
            }

            #cat-container {
                width: 160px;
                height: 160px;
            }

            button {
                padding: 14px 28px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <h1 id="question">
        Are you willing to use a BOM template that helps avoid manual errors, keeps formatting consistent, and saves time?
    </h1>

    <div id="cat-area">
        <div id="cat-message">
            Don't upset the cat.<br>Don't make him wait.
        </div>

        <div id="cat-container">
            <img id="cat-img" src="start.jpg.jpg" alt="Cat">
        </div>
    </div>

    <div class="btn-group" id="controls">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <div id="message" class="success-text"></div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const catImg = document.getElementById('cat-img');
        const catMessage = document.getElementById('cat-message');
        const question = document.getElementById('question');
        const message = document.getElementById('message');
        const controls = document.getElementById('controls');
        const catArea = document.getElementById('cat-area');

        const catSequence = [
            "sad1.jpg.jpeg",
            "sad2.jpg.jpg",
            "sad3.jpg.jpg",
            "cry1.jpg.jpeg",
            "cry2.jpg.jpeg",
            "cry3.jpg.jpeg"
        ];

        const happyCat = "happy.jpg.jpeg";

        let catStep = 0;
        let yesScale = 1;

        function changeCat() {
            catImg.style.opacity = 0;

            setTimeout(() => {
                catImg.src = catSequence[catStep];
                catImg.style.opacity = 1;

                catStep = (catStep + 1) % catSequence.length;
            }, 200);
        }

        const timer = setInterval(() => {
            if (catMessage.style.display !== 'block') {
                catMessage.style.display = 'block';
            }

            changeCat();
        }, 3000);

        const moveNo = (e) => {
            if (e) e.preventDefault();

            noBtn.style.position = 'fixed';

            const x = Math.random() * (window.innerWidth - 140);
            const y = Math.random() * (window.innerHeight - 90);

            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            yesScale += 0.35;
            yesBtn.style.transform = `scale(${yesScale})`;
        };

        noBtn.addEventListener('mouseover', moveNo);
        noBtn.addEventListener('touchstart', moveNo);

        yesBtn.addEventListener('click', () => {
            clearInterval(timer);

            confetti({
                particleCount: 250,
                spread: 90
            });

            question.style.display = 'none';
            controls.style.display = 'none';
            catMessage.style.display = 'none';

            catImg.src = happyCat;

            catArea.style.position = "static";
            catArea.style.margin = "20px auto";
            catArea.style.justifyContent = "center";

            message.innerHTML =
                "See? You just couldn't say no to efficiency 😉<br><br>I knew you'd make the right choice.";

            message.style.display = 'block';

            document.body.style.backgroundColor = "#e8f5e9";
        });
    </script>

</body>
</html>
