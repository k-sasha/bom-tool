<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM Decision Tool</title>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5dc;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #1a1a1a;
            text-align: center;
            max-width: 700px;
            padding: 20px;
            z-index: 10;
        }

        #cat-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 240px;
            height: 240px;
            z-index: 5;
        }

        #cat-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background-color: white;
            transition: opacity 0.3s ease;
        }

        .btn-group {
            display: flex;
            gap: 30px;
            margin-top: 50px;
            z-index: 20;
        }

        button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            transition: transform 0.2s ease;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
        }

        .success-text {
            display: none;
            font-size: 28px;
            color: #2e7d32;
            text-align: center;
            font-weight: bold;
            padding: 20px;
            max-width: 700px;
        }
    </style>
</head>

<body>

    <h1 id="question">
        Are you willing to use a BOM template that helps avoid manual errors, keeps formatting consistent, and saves time?
    </h1>

    <div id="cat-container">
        <img id="cat-img" src="start.jpg" alt="Cat">
    </div>

    <div class="btn-group" id="controls">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <div id="message" class="success-text"></div>

    <script>

        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const catImg = document.getElementById('cat-img');
        const question = document.getElementById('question');
        const message = document.getElementById('message');
        const controls = document.getElementById('controls');

        // 3 стадии грусти
        const sadCats = [
            "sad1.jpg",
            "sad2.jpg",
            "sad3.jpg"
        ];

        // 3 стадии плача
        const cryingCats = [
            "cry1.jpg",
            "cry2.jpg",
            "cry3.jpg"
        ];

        // довольный кот после YES
        const happyCat = "happy.jpg";

        let sadStep = 0;
        let cryStep = 0;
        let yesScale = 1;

        // Каждые 3 сек кот становится грустнее
        const timer = setInterval(() => {

            if (sadStep < sadCats.length) {

                catImg.style.opacity = 0;

                setTimeout(() => {

                    catImg.src = sadCats[sadStep];

                    catImg.style.opacity = 1;

                    sadStep++;

                }, 200);
            }

        }, 3000);

        // Убегающая кнопка NO
        const moveNo = (e) => {

            if (e) e.preventDefault();

            noBtn.style.position = 'fixed';

            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 70);

            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // YES становится больше
            yesScale += 0.35;

            yesBtn.style.transform = `scale(${yesScale})`;

            // При попытке нажать NO:
            // переключаем плачущие картинки
            if (cryStep < cryingCats.length - 1) {
                cryStep++;
            }

            catImg.style.opacity = 0;

            setTimeout(() => {

                catImg.src = cryingCats[cryStep];

                catImg.style.opacity = 1;

            }, 150);
        };

        noBtn.addEventListener('mouseover', moveNo);
        noBtn.addEventListener('touchstart', moveNo);

        // YES
        yesBtn.addEventListener('click', () => {

            clearInterval(timer);

            confetti({
                particleCount: 250,
                spread: 90
            });

            question.style.display = 'none';
            controls.style.display = 'none';

            catImg.src = happyCat;

            catImg.parentElement.style.position = "static";
            catImg.parentElement.style.margin = "20px auto";

            message.innerHTML =
                "See? You just couldn't say no to efficiency 😉<br><br>I knew you'd make the right choice.";

            message.style.display = 'block';

            document.body.style.backgroundColor = "#e8f5e9";
        });

    </script>

</body>
</html>
